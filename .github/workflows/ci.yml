name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build:compile

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Spellcheck
        run: npm run spellcheck

      - name: Markdown lint
        run: npm run lint:md

      - name: Test
        run: npm run test
