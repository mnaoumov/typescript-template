name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build:compile

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Spellcheck
        run: npm run spellcheck

      - name: Markdown lint
        run: npm run lint:md

      # The rule sources under `scripts/helpers/eslint-rules/` are hand-copies of `obsidian-dev-utils`'.
      # The pre-commit hook runs this too, but only when a copy is STAGED, so it can never notice upstream
      # moving underneath a tree nobody is editing — which is the drift direction that produced the gate.
      # `GITHUB_TOKEN` is the runner's own token: unauthenticated, GitHub's contents API allows 60 requests
      # an hour per address, which a shared runner can have spent before this step is reached.
      - name: Check vendored ESLint rules
        run: npm run check:vendored-eslint-rules
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The helpers under `scripts/helpers/` are peer copies, shared byte-for-byte with
      # `obsidian-test-mocks` and `obsidian-typings-crawler`. Same reasoning as the step above: the pre-commit
      # hook runs this too, but only when a copy is STAGED, so it can never notice the peer moving underneath
      # a file nobody is editing — the direction five of the eleven copies had drifted in before this existed.
      - name: Check helpers sync
        run: npm run check:helpers-sync
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Test
        run: npm run test
